# ═══════════════════════════════════════════════════════════════════════
#  ДАННЫЕ РЕСТОРАНА
#
#  Всё, что бот и AI-помощник знают о ресторане. Меняйте текст в кавычках.
#  Для кавычек внутри текста используйте «ёлочки».
#
#  Текст на нескольких языках:        Текст для всех языков сразу:
#    name:                              phone: "+998 71 200-00-00"
#      ru: "Текст на русском"
#      uz: "O'zbekcha matn"
#
#  После изменений перезапустите бота или нажмите «🔄 Обновить данные
#  из файлов» в панели /admin. Проверить файлы на ошибки: npm run check
# ═══════════════════════════════════════════════════════════════════════

# Языки бота. Первый — основной. Для каждого нужен файл texts/<код языка>.yaml
languages: [ru, uz]

# Часовой пояс ресторана
timezone: "Asia/Tashkent"

currency:
  name:
    ru: "сум"
    uz: "so'm"
  decimals: 0 # знаков после запятой в ценах: 0 — для сумов, 2 — для долларов и евро

# Код страны: подставляется, если клиент напишет номер без него (90 123 45 67)
phone_country_code: "998"

name: "Baxt"

# Коротко о ресторане (до 120 символов) — видно в профиле бота
tagline:
  ru: "Узбекская и европейская кухня с доставкой по Ташкенту"
  uz: "O'zbek va Yevropa taomlari, Toshkent bo'ylab yetkazib berish"

# Описание — в разделе «О нас» и на экране бота до нажатия «Start»
description:
  ru: "Готовим плов в казане, лагман ручной тянки и пиццу в дровяной печи. Привозим горячим по всему Ташкенту."
  uz: "Qozonda osh, qo'lda cho'zilgan lag'mon va o'tin pechida pitsa tayyorlaymiz. Toshkent bo'ylab issiq holda yetkazib beramiz."

# Приветствие после /start. {name} — имя клиента
welcome:
  ru: |
    Здравствуйте, {name}! 👋
    Добро пожаловать в <b>Baxt</b> — ресторан узбекской и европейской кухни.

    🍽 Нажмите кнопку ниже, чтобы открыть меню и оформить доставку или самовывоз
    🤖 Или просто напишите вопрос сюда в чат — например, «до скольки вы работаете?»
  uz: |
    Assalomu alaykum, {name}! 👋
    <b>Baxt</b> restoraniga xush kelibsiz — o'zbek va Yevropa taomlari.

    🍽 Menyuni ochish va yetkazib berish yoki olib ketishga buyurtma berish uchun pastdagi tugmani bosing
    🤖 Yoki shu yerga savolingizni yozing — masalan, «soat nechagacha ishlaysizlar?»

# Фото к приветствию: ссылка или файл из папки restaurant/images (например images/logo.jpg).
# Если фото не нужно — удалите строку
welcome_photo: "https://images.unsplash.com/photo-1670819917685-f1040e76b9b7?w=1000&q=80&fm=jpg&fit=crop"

contacts:
  phone: "+998 71 200-00-00"
  address:
    ru: "г. Ташкент, Мирзо-Улугбекский район, ул. Буюк Ипак Йули, 12"
    uz: "Toshkent sh., Mirzo Ulug'bek tumani, Buyuk Ipak Yo'li ko'chasi, 12"
  landmark:
    ru: "рядом со станцией метро «Буюк Ипак Йули»"
    uz: "«Buyuk Ipak Yo'li» metro bekati yonida"
  # Координаты для кнопки «Показать на карте» (можно взять из Google или Яндекс Карт)
  location:
    latitude: 41.3259
    longitude: 69.3306
  # Ссылки — уберите # в начале строки и вставьте свои
  # instagram: "https://instagram.com/baxt_restaurant"
  # website: "https://baxt.uz"

# Часы работы. Формат "10:00-23:00". Выходной день — "closed".
# Работа после полуночи — "18:00-02:00". Круглосуточно — "00:00-24:00"
hours:
  monday: "10:00-23:00"
  tuesday: "10:00-23:00"
  wednesday: "10:00-23:00"
  thursday: "10:00-23:00"
  friday: "10:00-00:00"
  saturday: "10:00-00:00"
  sunday: "10:00-23:00"

orders:
  # Принимать заказы, когда ресторан закрыт: true — да, false — нет
  accept_when_closed: false

delivery:
  enabled: true # false — доставки нет
  price: 15000 # стоимость доставки
  free_from: 200000 # бесплатная доставка от этой суммы (0 — всегда платная)
  min_order: 60000 # минимальная сумма заказа на доставку (0 — без минимума)
  time:
    ru: "40–60 минут"
    uz: "40–60 daqiqa"
  area:
    ru: "по всему Ташкенту"
    uz: "Toshkent shahri bo'ylab"

pickup:
  enabled: true # false — самовывоза нет
  time:
    ru: "20–30 минут"
    uz: "20–30 daqiqa"

# Необязательно: блюдо, которое Mini App предложит добавить в корзину
# (id блюда — как в menu.yaml). Уберите строку, если такое предложение не нужно
upsell_product_id: "lemonade"

# Способы оплаты — клиент выбирает при оформлении заказа
payment_methods:
  - ru: "💵 Наличными"
    uz: "💵 Naqd pul"
  - ru: "💳 Картой при получении"
    uz: "💳 Olganda karta orqali"
  - ru: "📲 Click или Payme"
    uz: "📲 Click yoki Payme"

# Частые вопросы. AI-помощник отвечает на основе этих фактов, меню, адреса,
# часов работы, доставки и оплаты. Пишите только правду — AI ничего не придумывает.
# Достаточно одного языка: AI сам ответит клиенту на его языке.
faq:
  - q: "Мясо халяльное?"
    a: "Да, всё мясо в ресторане халяль."
  - q: "Есть ли парковка?"
    a: "Да, у входа есть бесплатная парковка."
  - q: "Можно ли забронировать столик?"
    a: "Да, по телефону +998 71 200-00-00."
  - q: "Можно ли приготовить блюдо без лука или другого ингредиента?"
    a: "Да, напишите пожелание в комментарии к заказу — повар учтёт его, если это возможно."
  - q: "Есть ли детское меню?"
    a: "Отдельного детского меню нет. Детям чаще всего заказывают пиццу «Маргарита», картофель фри и домашний лимонад."
  - q: "Есть ли Wi-Fi?"
    a: "Да, для гостей есть бесплатный Wi-Fi."
  - q: "Проводите ли вы банкеты?"
    a: "Да, есть зал на 40 гостей. Условия — по телефону +998 71 200-00-00."

# Дополнительные сведения для AI-помощника в свободной форме (необязательно)
ai_notes: |
  Самое популярное блюдо — ташкентский плов.
  Острота блюд в меню указана по шкале от 0 до 3: 0 — не острое, 3 — очень острое.

# Готовые вопросы-кнопки в разделе «🤖 Задать вопрос»
example_questions:
  - ru: "🕒 До скольки вы работаете?"
    uz: "🕒 Soat nechagacha ishlaysizlar?"
  - ru: "🚚 Есть ли доставка?"
    uz: "🚚 Yetkazib berish bormi?"
  - ru: "🌶 Что порекомендуете из самого острого?"
    uz: "🌶 Eng achchiq taomlardan nimani tavsiya qilasiz?"
