# ═══════════════════════════════════════════════════════════════════════
#  МЕНЮ РЕСТОРАНА
#
#  Категории и блюда показываются в том порядке, в котором написаны.
#
#  Поля блюда:
#    id           уникальный код латиницей, например plov (после запуска не меняйте)
#    name         название
#    description  описание или состав
#    price        цена — только число, без пробелов
#    old_price    старая цена, будет зачёркнута (необязательно)
#    weight       вес, объём или количество (необязательно)
#    photo        ссылка на фото или файл из папки restaurant/images (необязательно)
#    spicy        острота от 0 до 3 (необязательно)
#    badges       метки: hit — хит, new — новинка, vegetarian — вегетарианское (необязательно)
#
#  Чтобы новое блюдо появилось в боте — перезапустите бота или нажмите
#  «🔄 Обновить данные из файлов» в панели /admin.
#  Временно убрать блюдо из продажи можно в боте: /admin → ⛔ Стоп-лист
# ═══════════════════════════════════════════════════════════════════════

categories:
  - id: national
    name:
      ru: "🍲 Национальные блюда"
      uz: "🍲 Milliy taomlar"
    items:
      - id: plov
        name:
          ru: "Ташкентский плов"
          uz: "Toshkent oshi"
        description:
          ru: "Рис девзира, нежная баранина, жёлтая морковь, нут, перепелиное яйцо и казы"
          uz: "Devzira guruch, yumshoq qo'y go'shti, sariq sabzi, no'xat, bedana tuxumi va qazi"
        price: 55000
        weight: { ru: "400 г", uz: "400 g" }
        photo: "https://images.unsplash.com/photo-1785571903557-dce44dcf3eab?w=800&q=80&fm=jpg&fit=crop"
        badges: [hit]

      - id: lagman
        name:
          ru: "Лагман"
          uz: "Lag'mon"
        description:
          ru: "Лапша ручной тянки, говядина, болгарский перец, редька, чеснок и острый соус"
          uz: "Qo'lda cho'zilgan lag'mon, mol go'shti, bolgar qalampiri, turp, sarimsoq va achchiq sous"
        price: 42000
        weight: { ru: "450 г", uz: "450 g" }
        spicy: 1
        photo: "https://images.unsplash.com/photo-1504669221159-56caf7b07f57?w=800&q=80&fm=jpg&fit=crop"

      - id: manti
        name:
          ru: "Манты"
          uz: "Manti"
        description:
          ru: "Сочные манты на пару с рубленой бараниной и луком, подаются со сметаной"
          uz: "Qiyma qo'y go'shti va piyozli bug'da pishgan shirali manti, qaymoq bilan"
        price: 40000
        weight: { ru: "4 шт", uz: "4 dona" }
        photo: "https://images.unsplash.com/photo-1783699373378-4232eab55fba?w=800&q=80&fm=jpg&fit=crop"

      - id: samsa
        name:
          ru: "Самса с говядиной"
          uz: "Mol go'shtli somsa"
        description:
          ru: "Слоёное тесто из тандыра, рубленая говядина, лук и зира"
          uz: "Tandirda pishgan qatlama xamir, qiyma mol go'shti, piyoz va zira"
        price: 12000
        weight: { ru: "1 шт", uz: "1 dona" }
        photo: "https://images.unsplash.com/photo-1601050690597-df0568f70950?w=800&q=80&fm=jpg&fit=crop"

      - id: shashlik
        name:
          ru: "Шашлык из баранины"
          uz: "Qo'y go'shtidan kabob"
        description:
          ru: "Маринованная баранина на углях, подаётся с луком и зеленью"
          uz: "Cho'g'da pishirilgan marinadlangan qo'y go'shti, piyoz va ko'katlar bilan"
        price: 38000
        old_price: 45000
        weight: { ru: "1 шампур, 180 г", uz: "1 six, 180 g" }
        photo: "https://images.unsplash.com/photo-1747253255646-3bffa4565a7a?w=800&q=80&fm=jpg&fit=crop"

